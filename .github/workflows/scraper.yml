name: Scheduled News Ingestion

on:
  schedule:
    # Runs every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual "Run workflow" button in GitHub

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests schedule

      - name: Run Scraper and Push to Vercel
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          VERCEL_SITE_URL: ${{ secrets.VERCEL_SITE_URL }}
        run: |
          python scripts/news_scraper.py \
            --api "${VERCEL_SITE_URL}/api/articles" \
            --api-key "${ADMIN_API_KEY}" \
            --run-once