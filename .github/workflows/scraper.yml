name: Scheduled News Ingestion

on:
  schedule:
    # Runs every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual "Run workflow" button in GitHub Actions tab

permissions:
  contents: write

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests schedule

      - name: Run Scraper Engine
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY || 'ushotnews_secret_scraper_key_2026' }}
          VERCEL_SITE_URL: ${{ secrets.VERCEL_SITE_URL || 'http://ushotnews.online' }}
        run: |
          python scripts/news_scraper.py \
            --api "${VERCEL_SITE_URL}/api/articles" \
            --api-key "${ADMIN_API_KEY}" \
            --run-once

      - name: Commit and Push Updated Articles
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scraped_articles.json
          git diff --staged --quiet || (git commit -m "chore(scraper): auto-ingest latest news wire [skip ci]" && git push)