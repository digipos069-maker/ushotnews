name: Facebook Page Auto-Publisher

on:
  schedule:
    # Automatically runs every hour at minute 15 (e.g. 1:15, 2:15, etc.)
    - cron: '15 * * * *'
  workflow_dispatch: # Allows manual "Run workflow" trigger in GitHub Actions

permissions:
  contents: write

jobs:
  publish-to-facebook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Check Credentials & Run Facebook Publisher
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID || secrets.PAGE_ID || secrets.FB_PAGEID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN || secrets.FB_ACCESS_TOKEN || secrets.PAGE_ACCESS_TOKEN }}
          NEXT_PUBLIC_SITE_URL: "https://ushotnews.online"
        run: |
          echo "=================================================="
          echo "🔍 Checking GitHub Secrets for Facebook..."
          if [ -z "$FB_PAGE_ID" ] || [ -z "$FB_PAGE_ACCESS_TOKEN" ]; then
            echo "❌ [ERROR] Missing Facebook Credentials in GitHub Secrets!"
            echo "   Checked secret names: FB_PAGE_ID (or PAGE_ID) and FB_PAGE_ACCESS_TOKEN (or FB_ACCESS_TOKEN)"
            echo ""
            echo "   Please add them in your GitHub Repository under:"
            echo "   Settings -> Secrets and variables -> Actions -> Repository secrets"
            echo "   1. FB_PAGE_ID: your Facebook Page ID (e.g. 100092837482)"
            echo "   2. FB_PAGE_ACCESS_TOKEN: your Page Access Token"
            echo "=================================================="
            exit 1
          fi

          echo "✅ Facebook Credentials found in GitHub Secrets!"
          echo "   Page ID length: ${#FB_PAGE_ID}"
          echo "   Token length: ${#FB_PAGE_ACCESS_TOKEN}"
          echo "=================================================="
          python scripts/fb_poster/fb_publisher.py --limit 1

      - name: Commit and Push Updated Posting History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fb_posted_history.json
          git diff --staged --quiet || (git commit -m "chore(fb-poster): record published story [skip ci]" && git push)
