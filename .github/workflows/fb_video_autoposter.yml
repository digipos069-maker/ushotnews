name: Facebook Page Video Auto-Publisher (Trending US Real News Video)

on:
  schedule:
    # Runs every 2 hours at minute 0
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows manual "Run workflow" trigger in GitHub Actions

permissions:
  contents: write

jobs:
  publish-trending-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Dependencies (yt-dlp, requests, feedparser)
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade --no-cache-dir requests feedparser yt-dlp

      - name: Check Credentials & Run Video Publisher (With Auto-Retry)
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID || secrets.PAGE_ID || secrets.FB_PAGEID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN || secrets.FB_ACCESS_TOKEN || secrets.PAGE_ACCESS_TOKEN }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          NEXT_PUBLIC_SITE_URL: "https://ushotnews.online"
        run: |
          echo "=================================================="
          echo "🔍 Checking GitHub Secrets for Facebook Video Auto-Publisher..."
          if [ -z "$FB_PAGE_ID" ] || [ -z "$FB_PAGE_ACCESS_TOKEN" ]; then
            echo "❌ [ERROR] Missing Facebook Credentials in GitHub Secrets!"
            echo "   Please add FB_PAGE_ID and FB_PAGE_ACCESS_TOKEN in Repository Secrets."
            exit 1
          fi

          if [ -n "$YT_COOKIES" ]; then
            echo "$YT_COOKIES" > cookies.txt
            echo "🍪 Exported YouTube cookies to cookies.txt"
          fi

          echo "✅ Facebook Credentials found in GitHub Secrets!"
          echo "🎥 Running Top Trending US Real News Video Auto-Publisher with retry logic..."
          echo "=================================================="

          MAX_RETRIES=3
          RETRY_COUNT=0
          SUCCESS=0

          until [ $RETRY_COUNT -ge $MAX_RETRIES ]; do
            RETRY_COUNT=$((RETRY_COUNT+1))
            echo "▶️ Execution Attempt $RETRY_COUNT of $MAX_RETRIES..."
            
            if python scripts/fb_poster/fb_video_publisher.py --limit 1 --pool-size 50; then
              echo "✅ Video Publisher finished successfully on attempt $RETRY_COUNT!"
              SUCCESS=1
              break
            else
              echo "⚠️ Attempt $RETRY_COUNT encountered an issue."
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                echo "⏳ Waiting 15 seconds before retrying..."
                sleep 15
              fi
            fi
          done

          if [ $SUCCESS -ne 1 ]; then
            echo "❌ Video Publisher failed after $MAX_RETRIES attempts."
            exit 1
          fi

      - name: Commit and Push Updated Video History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fb_video_posted_history.json
          
          # Retry git commit/push up to 3 times in case of rebase race conditions
          for i in {1..3}; do
            if git diff --staged --quiet; then
              echo "No new history changes to commit."
              break
            fi
            git commit -m "chore(fb-video-poster): record published trending real video [skip ci]" || true
            if git pull --rebase origin main && git push origin main; then
              echo "✅ History pushed successfully to main branch."
              break
            fi
            echo "⚠️ Git push retry $i failed, retrying in 5 seconds..."
            sleep 5
          done
